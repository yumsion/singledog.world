<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>单身狗的勋章 · 三十周年纪念 | 自适应缩放</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f9f3e6 0%, #fff4e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            padding: 2rem 1.5rem;
        }

        /* 主容器：自适应 + 优雅呼吸感 */
        .medal-container {
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 250, 240, 0.7);
            backdrop-filter: blur(2px);
            border-radius: 4rem 2rem 4rem 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 1px 2px rgba(0, 0, 0, 0.05);
            padding: 2rem 1.8rem 2.5rem;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* SVG 包装器：实现智能缩放，完全适应窗口且无留白溢出 */
        .badge-svg-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-height: 100vh;
            margin: 0.25rem 0 0.8rem 0;
            overflow: visible;
            background: transparent;
        }

        /* 关键：让 SVG 自适应缩放，并保持原始比例 */
        .medal-svg {
            width: 100%;
            height: auto;
            display: block;
            /* 最大宽度限制，防止在小屏幕过分拉伸，但仍保持弹性 */
            max-width: 100%;
            /* 保持原始宽高比，缩放到容器宽度 */
            object-fit: contain;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.15));
            transition: transform 0.25s ease;
            /* 修正任何潜在的viewBox偏差，确保完美居中显示 */
            background: transparent;
        }


        /* 寄语区域：浪漫又不失鼓励 */
        .anniversary-message {
            margin-top: 1.5rem;
            padding: 1rem 1.2rem;
            background: #ffffffd9;
            border-radius: 2.5rem;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255,255,255,0.8);
            border: 1px solid #ffdfb8;
        }

        .quote-icon {
            font-size: 2rem;
            line-height: 1;
            color: #e0a878;
            margin-bottom: 0.5rem;
            opacity: 0.7;
        }

        .message-text {
            font-size: 1.3rem;
            font-weight: 500;
            color: #3e2a1f;
            letter-spacing: -0.2px;
            line-height: 1.45;
            margin-bottom: 0.5rem;
        }

        .sub-message {
            font-size: 1rem;
            color: #b57c48;
            border-top: 1px dashed #ffe0bf;
            display: inline-block;
            padding-top: 0.6rem;
            margin-top: 0.3rem;
            font-style: italic;
        }

        /* 响应式细调: 手机舒适度 */
        @media (max-width: 640px) {
            .medal-container {
                padding: 1.2rem 1rem 1.8rem;
                border-radius: 2rem 1.5rem 2rem 1.5rem;
            }
            .message-text {
                font-size: 1.1rem;
            }
            .quote-icon {
                font-size: 1.6rem;
            }
            .badge-svg-wrapper {
                margin: 0 0 0.5rem;
            }
        }

        /* 精致装饰小元素 */
        .footer-note {
            font-size: 0.7rem;
            color: #cbad8b;
            margin-top: 2rem;
            text-align: center;
            opacity: 0.7;
        }

        .thirty-badge {
            background: #f1ddc4;
            display: inline-block;
            border-radius: 40px;
            padding: 0.2rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #a55317;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
        }
        
        /* 轻量级说明 */
        .frame-note {
            font-size: 0.65rem;
            color: #c8a57b;
            margin-top: 0.5rem;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }
    </style>
</head>
