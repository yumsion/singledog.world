<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>单身狗的世界 勋章</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif;
            background: #f5f7fb;
            padding: 20px;
            color: #1e293b;
            line-height: 1.4;
        }

        /* 主容器，自适应最大宽度，居中 */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.02);
            overflow: hidden;
            padding: 1.5rem 1.25rem 2rem 1.25rem;
            transition: all 0.2s ease;
        }

        /* 头部样式 */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 1.8rem;
            gap: 1rem;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .filter-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 0.5rem 1rem;
            border-radius: 60px;
        }

        .filter-label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #334155;
        }

        #yearSelect {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 20px 8px 14px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #0f172a;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23334155' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 36px;
        }

        #yearSelect:hover {
            border-color: #3b82f6;
            background-color: #ffffff;
        }

        #yearSelect:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
        }

        /* 表格容器，支持横向滚动，移动端优雅 */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #edf2f7;
            background: #ffffff;
            margin-top: 0.5rem;
        }

        /* 表格设计：干净、响应式 */
        .links-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 380px;
        }

        .links-table th {
            background: #f1f5f9;
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: #1e293b;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }

        .links-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #ecf3fa;
            vertical-align: middle;
            word-break: break-word;
        }

        /* 年份徽章样式 */
        .year-badge {
            background: #eef2ff;
            color: #1e3a8a;
            font-weight: 600;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.8rem;
            display: inline-block;
            text-align: center;
            min-width: 65px;
        }

        .link-title {
            font-weight: 500;
            color: #0f172a;
        }

        .link-url {
            text-decoration: none;
            color: #3b82f6;
            font-family: ui-monospace, 'SF Mono', monospace;
            font-size: 0.85rem;
            word-break: break-all;
            transition: color 0.2s;
        }

        .link-url:hover {
            color: #1e40af;
            text-decoration: underline;
        }

        /* 空状态样式 */
        .empty-row td {
            text-align: center;
            padding: 3rem 1rem;
            color: #64748b;
            font-style: normal;
            background: #fefce8;
        }

        /* 底部统计信息 */
        .stats-info {
            margin-top: 1.2rem;
            text-align: right;
            font-size: 0.8rem;
            color: #5b6e8c;
            padding-top: 0.8rem;
            border-top: 1px solid #ecf3f5;
        }

        /* 手机优化 */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 1rem;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .filter-area {
                width: 100%;
                justify-content: space-between;
            }
            .links-table th,
            .links-table td {
                padding: 10px 12px;
            }
            .link-url {
                font-size: 0.8rem;
            }
            h1 {
                font-size: 1.5rem;
            }
        }

        /* 小型设备下的触摸优化 */
        @media (max-width: 480px) {
            .links-table th, .links-table td {
                padding: 8px 10px;
            }
            .year-badge {
                padding: 2px 8px;
                font-size: 0.75rem;
                min-width: 55px;
            }
        }

        /* 行悬浮轻微效果 */
        .links-table tbody tr:hover td {
            background-color: #fafcff;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📌 导航·链接库</h1>
        <div class="filter-area">
            <span class="filter-label">📅 筛选年份：</span>
            <select id="yearSelect" aria-label="选择年份筛选链接">
                <option value="all">📆 全部年份</option>
                <option value="2026">2026 年</option>
                <option value="2025">2025 年</option>
                <option value="2024">2024 年</option>
                <option value="2023">2023 年</option>
            </select>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="links-table" id="linksTable">
            <thead>
                <tr>
                    <th>📅 链接的年份</th>
                    <th>📄 链接的标题</th>
                    <th>🔗 链接的地址</th>
                </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 动态js渲染 -->
                </tbody>
        </table>
    </div>
    <div class="stats-info" id="statsInfo"></div>
</div>

<script>
    // ---------- 链接数据源 -------------
    // 包含年份、标题、地址 (使用示例 + 扩充多样数据便于演示筛选)
    const linksData = [
        { year: 2026, title: "单身狗30年纪念勋章2026", url: "./medal_30y2026.html" },
    ];

    // 获取DOM元素
    const tbody = document.getElementById('tableBody');
    const yearSelect = document.getElementById('yearSelect');
    const statsInfo = document.getElementById('statsInfo');

    // 渲染表格函数，根据选中年份筛选数据
    function renderTable(selectedYear) {
        // 根据选中值过滤
        let filteredData = [];
        if (selectedYear === 'all') {
            filteredData = [...linksData];
        } else {
            const yearNum = parseInt(selectedYear, 10);
            filteredData = linksData.filter(item => item.year === yearNum);
        }

        // 清空tbody
        tbody.innerHTML = '';

        // 如果没有数据，显示空状态行
        if (filteredData.length === 0) {
            const emptyRow = document.createElement('tr');
            emptyRow.className = 'empty-row';
            emptyRow.innerHTML = `<td colspan="3">✨ 暂无 ${selectedYear !== 'all' ? selectedYear + ' 年' : ''} 相关链接，请调整筛选条件 ✨</td>`;
            tbody.appendChild(emptyRow);
            statsInfo.textContent = `共 0 条链接记录`;
            return;
        }

        // 遍历生成每一行
        filteredData.forEach(item => {
            const row = document.createElement('tr');
            
            // 年份单元格，加上徽章风格
            const yearCell = document.createElement('td');
            const yearSpan = document.createElement('span');
            yearSpan.className = 'year-badge';
            yearSpan.textContent = item.year;
            yearCell.appendChild(yearSpan);
            
            // 标题单元格
            const titleCell = document.createElement('td');
            titleCell.className = 'link-title';
            titleCell.textContent = item.title;
            
            // 链接地址单元格，使用a标签，新窗口打开更友好，保留地址跳转
            const urlCell = document.createElement('td');
            const linkAnchor = document.createElement('a');
            linkAnchor.href = item.url;
            linkAnchor.textContent = item.url;
            linkAnchor.className = 'link-url';
            linkAnchor.target = '_blank';
            linkAnchor.rel = 'noopener noreferrer';
            // 对于无效的非http开头，为了演示安全依旧保留原值。但示例都是https，添加对相对地址保护
            if (!item.url.startsWith('http://') && !item.url.startsWith('https://')) {
                // 若是相对地址或者其他协议，依然展示，但为了体验加前缀提示但是保留原始展示, 但无伤大雅
                // 不做强行改动，仅是展示
                linkAnchor.href = item.url;
            }
            urlCell.appendChild(linkAnchor);
            
            row.appendChild(yearCell);
            row.appendChild(titleCell);
            row.appendChild(urlCell);
            tbody.appendChild(row);
        });
        
        // 更新统计信息
        const totalCount = filteredData.length;
        const yearText = selectedYear === 'all' ? '全部' : selectedYear;
        statsInfo.innerHTML = `📋 当前显示 <strong>${totalCount}</strong> 条链接 ${selectedYear !== 'all' ? `（${selectedYear}年）` : '（所有年份）'} &nbsp;|&nbsp; 🗂️ 数据更新时间 2026`;
    }

    // 处理年份选择变化的事件
    function onYearChange() {
        const selectedValue = yearSelect.value;
        renderTable(selectedValue);
    }

    // 初始化页面：注册事件，执行初次渲染（全部）
    function init() {
        // 设置默认选中 "all"
        yearSelect.value = 'all';
        // 监听变化
        yearSelect.addEventListener('change', onYearChange);
        // 初次渲染显示全部数据
        renderTable('all');
    }

    // 启动
    init();
</script>
</body>
</html>
